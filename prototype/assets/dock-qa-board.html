<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dock 视觉对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #090a0d; color: #f5f6f8; font: 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 18px; }

  <main>

  </main>
