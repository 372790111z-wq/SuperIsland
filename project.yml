name: SuperIsland
options:
  bundleIdPrefix: com.workview
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
packages:
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: "0.3.0"
targets:
  SuperIsland:
    type: application
    platform: macOS
    sources:
      - path: SuperIsland
        excludes:
          - "**/.DS_Store"
      - path: KeepAwakeShared
      - path: ExtensionHost
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
      - path: prototype/assets/settings-previews
        buildPhase: resources
      - path: prototype/assets/settings-layouts
        buildPhase: resources
    dependencies:
      - package: Aptabase
      - target: KeepAwakeEventTool
        link: false
        embed: false
      - target: KeepAwakeHelper
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIsland
        INFOPLIST_FILE: SuperIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperIsland/SuperIsland.entitlements
        PRODUCT_NAME: SuperIsland
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "11"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: SuperIsland/SuperIsland.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.speech-recognition: true
    postCompileScripts:
      - name: "Copy Keep Awake Event Tool"
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}"
          cp "${BUILT_PRODUCTS_DIR}/KeepAwakeEventTool" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/KeepAwakeEventTool"
          cp "${BUILT_PRODUCTS_DIR}/KeepAwakeHelper" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/KeepAwakeHelper"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          cp "${SRCROOT}/KeepAwakeHelper/com.workview.SuperIsland.KeepAwakeHelper.plist" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier com.workview.SuperIsland.KeepAwakeHelper --options runtime "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/KeepAwakeHelper"
          fi
      - name: "Copy Built-in Extensions"
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundledExtensions"
          mkdir -p "$DEST"

          # Pre-bundle WhatsApp provider with esbuild so node_modules aren't needed at runtime
          WA_PROVIDER="${SRCROOT}/Extensions/whatsapp-web/provider"
          if [ "${PRODUCT_BUNDLE_IDENTIFIER}" = "com.workview.SuperIsland.WE1Debug" ]; then
            # Prepared explicitly from the pinned lockfile; a successful app
            # build must not silently ship an unusable provider.
            if [ ! -f "${WE1_WHATSAPP_PROVIDER_DIR}/bundle.cjs" ] || [ ! -f "${WE1_WHATSAPP_PROVIDER_DIR}/build.json" ]; then
              echo "error: Prepare WhatsApp with scripts/prepare-we1-whatsapp-provider.py and set WE1_WHATSAPP_PROVIDER_DIR."
              exit 1
            fi
            /usr/bin/python3 "${SRCROOT}/scripts/prepare-we1-whatsapp-provider.py" --output-dir "${WE1_WHATSAPP_PROVIDER_DIR}" --verify-only || exit 1
          elif [ -d "${WA_PROVIDER}/node_modules" ]; then
            echo "Bundling WhatsApp provider with esbuild..."
            npx --yes esbuild \
              "${WA_PROVIDER}/index.mjs" \
              --bundle \
              --platform=node \
              --format=cjs \
              --outfile="${WA_PROVIDER}/bundle.cjs" 2>&1 && echo "esbuild: done" || echo "esbuild: failed (will use index.mjs)"
          fi

          for ext in ai-usage pomodoro whatsapp-web agents-status linear-mentions lastfm-scrobbler; do
            SRC="${SRCROOT}/Extensions/${ext}"
            if [ -d "$SRC" ]; then
              rsync -a --delete \
                --exclude="node_modules/" \
                --exclude=".DS_Store" \
                --exclude="__pycache__/" \
                "${SRC}/" "${DEST}/${ext}/"
            fi
          done

          if [ "${PRODUCT_BUNDLE_IDENTIFIER}" = "com.workview.SuperIsland.WE1Debug" ]; then
            cp "${WE1_WHATSAPP_PROVIDER_DIR}/bundle.cjs" "${DEST}/whatsapp-web/provider/bundle.cjs"
            cp "${WE1_WHATSAPP_PROVIDER_DIR}/build.json" "${DEST}/whatsapp-web/provider/build.json"
            if [ -d "${WE1_WHATSAPP_PROVIDER_DIR}/licenses" ]; then
              rsync -a "${WE1_WHATSAPP_PROVIDER_DIR}/licenses/" "${DEST}/whatsapp-web/provider/licenses/"
            fi
          fi
  SuperIslandWindowEnhancementTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SuperIslandTests
    dependencies:
      - target: SuperIsland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIsland.WindowEnhancementTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false

  KeepAwakeEventTool:
    type: tool
    platform: macOS
    sources:
      - path: KeepAwakeEventTool
      - path: KeepAwakeShared/KeepAwakeHookContract.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIsland.KeepAwakeEventTool
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: true

  KeepAwakeHelper:
    type: tool
    platform: macOS
    sources:
      - path: KeepAwakeHelper
        excludes:
          - "*.plist"
      - path: KeepAwakeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIsland.KeepAwakeHelper
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: true
